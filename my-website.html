<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Website · Project Sarae</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{--navy:#16187e;--cream:#f6f1ea;--bg:#fdfbf7;--ink:#1b1b2b;--muted:#6b6b7b;--line:#e7e1d8;--accent:#c2614f;--ok:#2e7d4f}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);font-family:Inter,system-ui,sans-serif;color:var(--ink);display:flex;justify-content:center;padding:48px 16px}
  .card{width:100%;max-width:560px;background:#fff;border-radius:28px;padding:32px 30px;box-shadow:0 20px 60px rgba(22,24,126,.10)}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:18px}
  .ps{width:38px;height:38px;border-radius:10px;background:var(--navy);color:#fff;display:grid;place-items:center;font-family:'Playfair Display',serif}
  .brand b{font-family:'Playfair Display',serif;font-size:24px;color:var(--navy)}
  h1{font-family:'Playfair Display',serif;font-size:26px;margin:0 0 6px}
  .sub{color:var(--muted);margin:0 0 18px}
  label{display:block;font-weight:600;margin:14px 0 6px}
  input{width:100%;border:1px solid var(--line);border-radius:14px;padding:14px 16px;font:inherit;font-size:16px}
  .btn{display:block;text-align:center;text-decoration:none;width:100%;margin-top:18px;border:none;border-radius:16px;background:var(--navy);color:#fff;font:inherit;font-weight:700;font-size:16px;padding:15px;cursor:pointer}
  .btn.ghost{background:var(--cream);color:var(--navy)}
  .err{color:#b3261e;font-size:14px;min-height:18px}
  .banner{background:#e8f5ee;color:var(--ok);border-radius:14px;padding:12px 14px;font-weight:600;margin-bottom:16px}
  .order{border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:14px}
  .order h2{font-size:18px;margin:0 0 2px}
  .meta{color:var(--muted);font-size:14px}
  .steps{list-style:none;padding:0;margin:16px 0 0}
  .steps li{display:flex;gap:12px;align-items:center;padding:8px 0;color:var(--muted)}
  .steps li i{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:13px;flex:none}
  .steps li.done{color:var(--ink)} .steps li.done i{background:var(--navy);border-color:var(--navy);color:#fff}
  .steps li.now{color:var(--ink);font-weight:700} .steps li.now i{border-color:var(--accent);color:var(--accent)}
  .warn{background:#fff4e5;color:#8a4b00;border-radius:12px;padding:10px 12px;font-size:14px;margin-top:12px}
  .link{color:var(--navy);font-weight:600;cursor:pointer;background:none;border:none;font:inherit;padding:0}
  .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .order h2{overflow-wrap:anywhere}
  @media (min-width:900px){ body{padding:72px 24px} .card{max-width:640px;padding:40px 44px} }
  @media (max-width:600px){ body{padding:0;background:#fff}
    .card{max-width:none;min-height:100vh;border-radius:0;box-shadow:none;padding:calc(18px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom))}
    .order{padding:16px} h1{font-size:23px} .brand b{font-size:21px} }
</style>
</head>
<body>
<main class="card" id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js?v=6"></script>
<script src="content.js?v=3"></script>
<script>
const CFG = window.SITE_CONFIG || {};
const sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey);
const PLAN_NAMES = {}; ((window.SITE_CONTENT || {}).plans || []).forEach(p => PLAN_NAMES[p.key] = p.name);
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const params = new URLSearchParams(location.search);
const STAGES = [
  ["received","Got your answers"],["designing","Designing your site"],["review","Ready for your review"],["live","Your site is live! 🎉"]
];
const brand = `<div class="brand"><span class="ps">PS</span><b>Project Sarae</b></div>`;

function loginView(msg="") {
  app.innerHTML = `${brand}<h1>Check on your website</h1><p class="sub">Sign in with the email and password you made when you signed up.</p>
    <form id="login"><label>Email</label><input id="em" type="email" required>
    <label>Password</label><input id="pw" type="password" required>
    <p class="err" id="err">${esc(msg)}</p><button class="btn">Sign in</button></form>
    <p class="sub" style="margin-top:16px">New here? <a href="pricing.html">Pick a plan</a> · <button class="link" id="forgot">Forgot password?</button></p>`;
  document.getElementById("login").onsubmit = async e => {
    e.preventDefault();
    const { error } = await sb.auth.signInWithPassword({ email: em.value.trim(), password: pw.value });
    if (error) document.getElementById("err").textContent = "Wrong email or password."; else load();
  };
  document.getElementById("forgot").onclick = async () => {
    if (!em.value) { document.getElementById("err").textContent = "Type your email first."; return; }
    await sb.auth.resetPasswordForEmail(em.value.trim(), { redirectTo: location.href.split("?")[0] });
    document.getElementById("err").textContent = "Check your email for a reset link.";
  };
}

async function load() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return loginView();
  const { data: orders, error } = await sb.from("orders").select("*").order("created_at", { ascending: false });
  if (error) return loginView(error.message);
  const name = orders[0]?.contact_name || "there";
  app.innerHTML = `<div class="top">${brand}<button class="link" id="out">Sign out</button></div>
    ${params.get("paid") ? `<div class="banner">Payment received — thank you! I'm on it. You'll get an email at each step.</div>` : ""}
    <h1>Hey ${esc(name)} 👋</h1><p class="sub">Here's where your website is at.</p>
    ${orders.length ? orders.map(card).join("") : `<p>No website orders yet. <a href="pricing.html">Pick a plan</a> to get started.</p>`}`;
  document.getElementById("out").onclick = async () => { await sb.auth.signOut(); loginView(); };
  app.querySelectorAll("[data-pay]").forEach(b => b.onclick = async () => {
    const o = orders.find(x => x.id === b.dataset.pay);
    const { data: links } = await sb.rpc("order_checkout_links", { p_order: o.id });
    const url = links && (b.dataset.kind === "setup" ? links.setup_url : links.plan_url);
    if (!url) { b.textContent = "Checkout link not ready — I'll text you"; return; }
    const u = new URL(url); u.searchParams.set("client_reference_id", o.id); u.searchParams.set("prefilled_email", o.email);
    location.href = u.toString();
  });
}

function card(o) {
  const idx = STAGES.findIndex(s => s[0] === o.status);
  const p = { name: PLAN_NAMES[o.plan] };
  let pay = "";
  if (!o.paid && !params.get("paid")) {
    pay = `<div class="warn">Checkout isn't finished yet, so I haven't started.</div><button class="btn" data-pay="${esc(o.id)}">Finish checkout</button>`;
  }
  return `<div class="order"><h2>${esc(o.business_name)}</h2>
    <div class="meta">${esc(p.name || o.plan)} plan · started ${new Date(o.created_at).toLocaleDateString()}</div>
    ${pay}
    <ul class="steps">${STAGES.map(([k, label], i) =>
      `<li class="${i < idx || (i === idx && k === "live") ? "done" : i === idx ? "now" : ""}"><i>${i < idx || k === "live" && i === idx ? "✓" : i + 1}</i>${label}</li>`).join("")}</ul>
    ${o.site_url ? `<a class="btn ${o.status === "live" ? "" : "ghost"}" href="${esc(o.site_url)}" target="_blank">${o.status === "live" ? "Visit your website" : "Preview your website"}</a>` : ""}
  </div>`;
}

sb.auth.onAuthStateChange(evt => { if (evt === "PASSWORD_RECOVERY") {
  const pw = prompt("Type your new password (8+ characters):");
  if (pw) sb.auth.updateUser({ password: pw }).then(() => load());
}});
load();
</script>
</body>
</html>
