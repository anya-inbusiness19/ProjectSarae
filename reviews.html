<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reviews | Project Sarae</title>
<meta name="description" content="Read reviews from Project Sarae clients, or leave your own.">

<meta property="og:title" content="Reviews | Project Sarae">
<meta property="og:description" content="Read reviews from Project Sarae clients, or leave your own.">
<meta property="og:image" content="images/favicon.png">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="images/favicon.png">
<link rel="apple-touch-icon" href="images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="reviews">
<div id="site-header"></div>
<main>
<section class="page-head"><div class="wrap"><span class="eyebrow">Reviews</span><h1>What clients say</h1></div></section>
<section>
  <div class="wrap">
    <div class="reviews-layout">
      <div>
        <div id="rating-summary"></div>
        <div id="review-list" class="stack"><div class="empty">Loading reviews…</div></div>
      </div>
      <form id="review-form" class="card" novalidate>
        <h3>Worked with me? Leave a review</h3>
        <p>Your review will appear after it’s checked.</p>
        <label for="r-name">Your name</label>
        <input id="r-name" maxlength="80" required autocomplete="name">
        <label for="r-business">Business name <span style="font-weight:500;color:var(--muted-2)">(optional)</span></label>
        <input id="r-business" maxlength="100" autocomplete="organization">
        <label>Rating</label>
        <div class="star-input" id="star-input" role="radiogroup" aria-label="Rating">
          <button type="button" role="radio" aria-checked="false" data-v="1" aria-label="1 star">★</button><button type="button" role="radio" aria-checked="false" data-v="2" aria-label="2 stars">★</button><button type="button" role="radio" aria-checked="false" data-v="3" aria-label="3 stars">★</button><button type="button" role="radio" aria-checked="false" data-v="4" aria-label="4 stars">★</button><button type="button" role="radio" aria-checked="false" data-v="5" aria-label="5 stars">★</button>
        </div>
        <label for="r-body">Your review</label>
        <textarea id="r-body" maxlength="1000" required></textarea>
        <button class="btn btn-primary btn-block" style="margin-top:18px" type="submit">Submit review</button>
        <div class="msg" id="review-msg" role="status"></div>
      </form>
    </div>
  </div>
</section>
</main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js?v=2"></script>
<script src="site.js?v=2"></script>
</body>
</html>
