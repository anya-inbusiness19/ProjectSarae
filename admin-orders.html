<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Orders · Project Sarae Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{--navy:#16187e;--cream:#f6f1ea;--bg:#fdfbf7;--ink:#1b1b2b;--muted:#6b6b7b;--line:#e7e1d8;--accent:#c2614f;--ok:#2e7d4f}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);font-family:Inter,system-ui,sans-serif;color:var(--ink);padding:32px 16px}
  .wrap{max-width:900px;margin:0 auto}
  h1{font-family:'Playfair Display',serif;color:var(--navy);margin:0}
  .bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
  .stat{background:#fff;border-radius:16px;padding:14px;box-shadow:0 4px 18px rgba(22,24,126,.06)}
  .stat b{display:block;font-size:24px;color:var(--navy)} .stat span{color:var(--muted);font-size:13px}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
  .chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .o{background:#fff;border-radius:20px;padding:18px;margin-bottom:12px;box-shadow:0 4px 18px rgba(22,24,126,.06)}
  .o h2{margin:0;font-size:18px}
  .tag{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;margin-left:6px}
  .paid{background:#e8f5ee;color:var(--ok)} .unpaid{background:#fff4e5;color:#8a4b00}
  .meta{color:var(--muted);font-size:14px;margin:4px 0 10px}
  dl{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;margin:10px 0;font-size:14px}
  dt{color:var(--muted)} dd{margin:0}
  .dots i{width:16px;height:16px;border-radius:50%;display:inline-block;border:1px solid #0002;vertical-align:middle;margin-right:3px}
  .act{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
  select,input{border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:14px}
  input.url{flex:1;min-width:200px}
  .btn{border:none;border-radius:12px;background:var(--navy);color:#fff;font:inherit;font-weight:700;padding:11px 16px;cursor:pointer;text-decoration:none;font-size:14px}
  .btn.ghost{background:var(--cream);color:var(--navy)}
  .ok{color:var(--ok);font-size:13px}
  .login{max-width:380px;margin:60px auto;background:#fff;border-radius:24px;padding:28px}
  .login input{width:100%;margin:6px 0 12px}
  @media (max-width:560px){ dl{grid-template-columns:1fr} dt{margin-top:6px} }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js?v=6"></script>
<script src="content.js?v=3"></script>
<script>
const CFG = window.SITE_CONFIG || {};
const sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey);
const PLANS = {}; let SET = {}; try { SET = JSON.parse(localStorage.getItem("ps_settings") || "{}") || {}; } catch(e) {}
let savedPlans = []; try { savedPlans = JSON.parse(SET.plans || "null") || []; } catch(e) {}
((window.SITE_CONTENT || {}).plans || []).forEach(p => { PLANS[p.key] = savedPlans.find(x => x && x.key === p.key) || p; });
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const COLORS = {"Black":"#111111","Cream":"#f4ecdf","White":"#ffffff","Navy":"#16187e","Royal Blue":"#2457d6","Sky Blue":"#7cc4f2","Teal":"#14877f","Forest Green":"#1f5b3a","Sage":"#a9b89a","Gold":"#c9a227","Orange":"#e9772b","Red":"#c62828","Blush Pink":"#f2b8c6","Purple":"#6a3db8","Brown":"#6b4428","Gray":"#8a8f98"};
const STATUSES = [["received","Got answers"],["designing","Designing"],["review","Ready for review"],["live","Live"]];
let orders = [], filter = "paid";

function loginView(msg = "") {
  app.innerHTML = `<form class="login" id="f"><h1>Admin</h1><p style="color:#b3261e">${esc(msg)}</p>
    <input id="em" type="email" placeholder="Email" value=""><input id="pw" type="password" placeholder="Password">
    <button class="btn" style="width:100%">Sign in</button></form>`;
  document.getElementById("f").onsubmit = async e => {
    e.preventDefault();
    const { error } = await sb.auth.signInWithPassword({ email: em.value.trim(), password: pw.value });
    error ? loginView("Wrong email or password.") : load();
  };
}

async function load() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return loginView();
  const { data: isAdmin } = await sb.rpc("is_admin");
  if (!isAdmin) { await sb.auth.signOut(); return loginView("That account isn't an admin."); }
  const { data, error } = await sb.from("orders").select("*").order("created_at", { ascending: false });
  if (error) return loginView(error.message);
  orders = data; render();
}

function money(o) { const p = PLANS[o.plan] || {}; return o.billing === "yearly" ? (p.yearly || 0) / 12 : (p.monthly || 0); }

function render() {
  const paid = orders.filter(o => o.paid);
  const mrr = paid.filter(o => o.status !== "cancelled").reduce((s, o) => s + money(o), 0);
  const list = orders.filter(o => filter === "all" ? true : filter === "paid" ? o.paid && o.status !== "live" : filter === "unpaid" ? !o.paid : o.status === "live");
  app.innerHTML = `<div class="bar"><h1>Website Orders</h1><div><a class="btn ghost" href="admin.html">← Admin</a> <button class="btn ghost" id="out">Sign out</button></div></div>
    <div class="stats">
      <div class="stat"><b>${paid.length}</b><span>Paid clients</span></div>
      <div class="stat"><b>$${Math.round(mrr)}</b><span>Monthly income</span></div>
      <div class="stat"><b>${paid.filter(o => o.status !== "live").length}</b><span>Sites to build</span></div>
      <div class="stat"><b>${orders.filter(o => !o.paid).length}</b><span>Didn't finish checkout</span></div>
    </div>
    <div class="filters">${[["paid","To build"],["unpaid","Didn't pay (follow up)"],["live","Live"],["all","All"]].map(([k, l]) =>
      `<button class="chip ${filter === k ? "on" : ""}" data-f="${k}">${l}</button>`).join("")}</div>
    ${list.length ? list.map(card).join("") : `<p style="color:var(--muted)">Nothing here yet.</p>`}`;
  document.getElementById("out").onclick = async () => { await sb.auth.signOut(); loginView(); };
}

function contactLinks(o) {
  const tel = (o.phone || "").replace(/[^\d+]/g, "");
  return `<a class="btn ghost" href="sms:${esc(tel)}">Text</a><a class="btn ghost" href="tel:${esc(tel)}">Call</a><a class="btn ghost" href="mailto:${esc(o.email)}">Email</a>`;
}

function card(o) {
  const plan = (PLANS[o.plan] || {}).name || o.plan;
  return `<div class="o" data-id="${o.id}">
    <h2>${esc(o.business_name)} <span class="tag ${o.paid ? "paid" : "unpaid"}">${o.paid ? "PAID" : "NOT PAID"}</span></h2>
    <div class="meta">${esc(plan)} (${esc(o.billing)}) · ${new Date(o.created_at).toLocaleString()}</div>
    <dl>
      <dt>Contact</dt><dd>${esc(o.contact_name)} · ${esc(o.phone)} · ${esc(o.email)}<br>Prefers <b>${esc(o.contact_method)}</b>, ${esc(o.best_time)}</dd>
      <dt>Business</dt><dd>${esc(o.business_type)}</dd>
      <dt>Vibe</dt><dd>${esc(o.vibe)}</dd>
      <dt>Colors</dt><dd class="dots">${(o.colors || []).map(c => `<i style="background:${esc(COLORS[c] || (c.startsWith("#") ? c : "#fff"))}"></i>${esc(c)}`).join(" &nbsp;")}</dd>
      <dt>Logo</dt><dd>${esc(o.logo_choice)} ${o.logo_path ? `<button class="btn ghost" data-logo="${esc(o.logo_path)}">Open logo</button>` : ""}</dd>
      <dt>Font</dt><dd>${esc(o.font)}</dd>
      <dt>Features</dt><dd>${esc((o.features || []).join(", "))}</dd>
      ${o.inspiration ? `<dt>Inspiration</dt><dd><a href="${esc(o.inspiration)}" target="_blank" rel="noopener">${esc(o.inspiration)}</a></dd>` : ""}
      ${o.notes ? `<dt>Notes</dt><dd>${esc(o.notes)}</dd>` : ""}
    </dl>
    <div class="act">${contactLinks(o)}</div>
    <div class="act">
      <select data-status>${STATUSES.map(([k, l]) => `<option value="${k}" ${o.status === k ? "selected" : ""}>${l}</option>`).join("")}</select>
      <input class="url" data-url placeholder="Site link (preview or live)" value="${esc(o.site_url || "")}">
      <button class="btn" data-save>Save & notify client</button><span class="ok" data-msg></span>
    </div></div>`;
}

app.addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.f) { filter = b.dataset.f; render(); return; }
  if (b.dataset.logo) {
    const { data } = await sb.storage.from("logos").createSignedUrl(b.dataset.logo, 600);
    if (data) window.open(data.signedUrl, "_blank"); return;
  }
  if (b.hasAttribute("data-save")) {
    const box = b.closest(".o"), id = box.dataset.id;
    const status = box.querySelector("[data-status]").value, site_url = box.querySelector("[data-url]").value.trim() || null;
    if (status === "live" && !site_url) { box.querySelector("[data-msg]").textContent = "Add the site link first."; return; }
    const changed = orders.find(o => o.id === id).status !== status;
    b.disabled = true;
    const { error } = await sb.from("orders").update({ status, site_url }).eq("id", id);
    b.disabled = false;
    box.querySelector("[data-msg]").textContent = error ? error.message : changed ? "Saved ✓ client emailed" : "Saved ✓";
    if (!error) Object.assign(orders.find(o => o.id === id), { status, site_url });
  }
});
load();
</script>
</body>
</html>
